name: coder-university-m4

services:
  db:
    image: postgres:15-alpine
    container_name: cu4-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "54322:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

  loki:
    image: grafana/loki:3.3.2
    container_name: cu4-loki
    ports:
      - "3100:3100"
    volumes:
      - ./infra/loki.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml

  tempo:
    image: grafana/tempo:2.6.1
    container_name: cu4-tempo
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./infra/tempo.yml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo
    command: -config.file=/etc/tempo/config.yaml

  mimir:
    image: grafana/mimir:2.12.0
    container_name: cu4-mimir
    ports:
      - "9009:9009"
    volumes:
      - ./infra/mimir.yml:/etc/mimir/mimir.yaml:ro
      - mimir-data:/data
    command: -config.file=/etc/mimir/mimir.yaml

  grafana:
    image: grafana/grafana:11.3.1
    container_name: cu4-grafana
    ports:
      - "3005:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
      - tempo
      - mimir

volumes:
  db-data:
  loki-data:
  tempo-data:
  mimir-data:
  grafana-data: